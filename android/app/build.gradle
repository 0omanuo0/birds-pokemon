apply plugin: 'com.android.application'

// Optional values from android/local.properties (gitignored, never committed):
//   birdsdex.siteUrl              site the app loads (default: production)
//   birdsdex.googleWebClientId    the *web* OAuth client id (= GOOGLE_CLIENT_ID), see GoogleSignInPlugin
//   birdsdex.sessionToken         debug shortcut cookie from scripts/android-session-token.mjs (never in release)
//   birdsdex.keystore / .keystorePassword / .keyAlias / .keyPassword    release signing
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace = "com.manu365.birdsdex"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (localProps.getProperty('birdsdex.keystore')) {
                storeFile rootProject.file(localProps.getProperty('birdsdex.keystore'))
                storePassword localProps.getProperty('birdsdex.keystorePassword')
                keyAlias localProps.getProperty('birdsdex.keyAlias')
                keyPassword localProps.getProperty('birdsdex.keyPassword')
            }
        }
    }
    defaultConfig {
        buildConfigField "String", "SITE_URL", "\"${localProps.getProperty('birdsdex.siteUrl', 'https://birds-pokemon.vercel.app')}\""
        buildConfigField "String", "SESSION_TOKEN", "\"${localProps.getProperty('birdsdex.sessionToken', '')}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${localProps.getProperty('birdsdex.googleWebClientId', '')}\""
        applicationId "com.manu365.birdsdex"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            // a release build always uses the real Google sign-in, never the baked-in debug session
            buildConfigField "String", "SESSION_TOKEN", "\"\""
            if (localProps.getProperty('birdsdex.keystore')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // native Google sign-in (GoogleSignInPlugin)
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
