<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Birds Dex</title>
    <style>
        html, body { height: 100%; margin: 0; background: #171717; color: #e5e5e5; font-family: system-ui, sans-serif; }
        main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
        img { width: 96px; height: 96px; }
        button { background: #e85d63; color: #fff; border: 0; padding: 12px 24px; font-size: 16px; border-radius: 6px; }
    </style>
</head>
<body>
    <main>
        <img src="icon-192.png" alt="">
        <h1>No connection</h1>
        <p>Birds Dex needs internet to load for now.</p>
        <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
    </main>
</body>
</html>
